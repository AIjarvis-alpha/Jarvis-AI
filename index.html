<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b16">
<title>JARVIS AI | Anime Edition</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --cyan: #00eaff;
    --blue: #087cff;
    --bg: #080b16;
    --panel: rgba(12, 23, 43, 0.88);
    --text: #eafaff;
    --muted: #8da9bd;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(ellipse at top, #102b48 0%, transparent 55%),
        var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.15;
    background-image:
        linear-gradient(rgba(0,234,255,.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,234,255,.15) 1px, transparent 1px);
    background-size: 35px 35px;
    mask-image: linear-gradient(to bottom, black, transparent);
}

header {
    width: 100%;
    padding: 22px 15px;
    text-align: center;
    border-bottom: 1px solid rgba(0,234,255,.2);
    background: rgba(5,10,22,.7);
    backdrop-filter: blur(12px);
}

.logo {
    font-size: clamp(25px, 6vw, 38px);
    letter-spacing: 7px;
    color: var(--cyan);
    text-shadow: 0 0 18px rgba(0,234,255,.6);
}

.subtitle {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 3px;
    margin-top: 8px;
}

main {
    width: min(100% - 24px, 760px);
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 0;
    gap: 20px;
}

.reactor {
    width: 155px;
    height: 155px;
    margin: 5px auto 0;
    position: relative;
    display: grid;
    place-items: center;
}

.ring {
    position: absolute;
    border: 1px solid rgba(0,234,255,.6);
    border-radius: 50%;
    box-shadow: 0 0 15px rgba(0,234,255,.15);
}

.ring-one {
    width: 100%;
    height: 100%;
    border-top: 3px solid var(--cyan);
    animation: rotate 6s linear infinite;
}

.ring-two {
    width: 78%;
    height: 78%;
    border-bottom: 3px solid var(--blue);
    animation: rotate 4s linear infinite reverse;
}

.ring-three {
    width: 57%;
    height: 57%;
    border-left: 3px solid #7af7ff;
    animation: rotate 3s linear infinite;
}

.core {
    width: 38%;
    height: 38%;
    border-radius: 50%;
    background: radial-gradient(circle, white 0%, var(--cyan) 25%, #087cff 70%);
    box-shadow: 0 0 20px var(--cyan), 0 0 50px rgba(0,234,255,.5);
    animation: pulse 2s ease-in-out infinite;
}

@keyframes rotate {
    to { transform: rotate(360deg); }
}

@keyframes pulse {
    50% { transform: scale(.82); opacity: .7; }
}

.status {
    color: var(--cyan);
    font-size: 11px;
    letter-spacing: 3px;
    text-align: center;
}

.welcome {
    text-align: center;
    font-size: 26px;
    font-weight: 400;
}

.welcome span {
    color: var(--cyan);
}

.description {
    color: var(--muted);
    text-align: center;
    font-size: 13px;
    line-height: 1.7;
    max-width: 420px;
}

.chat-panel {
    width: 100%;
    border: 1px solid rgba(0,234,255,.25);
    border-radius: 18px;
    background: var(--panel);
    box-shadow: 0 0 35px rgba(0,120,255,.08);
    overflow: hidden;
}

.chat-heading {
    padding: 15px 17px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(0,234,255,.15);
    color: var(--cyan);
    font-size: 12px;
    letter-spacing: 2px;
}

.live-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    margin-right: 7px;
    background: #36ff9a;
    border-radius: 50%;
    box-shadow: 0 0 8px #36ff9a;
}

#chat {
    height: 280px;
    overflow-y: auto;
    padding: 17px;
    display: flex;
    flex-direction: column;
    gap: 13px;
    scroll-behavior: smooth;
}

.message {
    max-width: 90%;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}

.bot {
    align-self: flex-start;
    background: rgba(0,234,255,.08);
    border: 1px solid rgba(0,234,255,.18);
}

.user {
    align-self: flex-end;
    background: rgba(8,124,255,.2);
    border: 1px solid rgba(8,124,255,.4);
}

.chat-controls {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid rgba(0,234,255,.15);
}

#userInput {
    flex: 1;
    width: 0;
    min-width: 0;
    padding: 13px;
    border: 1px solid rgba(0,234,255,.25);
    outline: none;
    border-radius: 10px;
    background: #080f20;
    color: white;
    font-size: 14px;
}

#userInput:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 10px rgba(0,234,255,.12);
}

button {
    border: 1px solid rgba(0,234,255,.5);
    background: rgba(0,234,255,.1);
    color: var(--cyan);
    border-radius: 10px;
    padding: 0 14px;
    font-size: 14px;
    cursor: pointer;
    transition: .2s;
    min-height: 44px;
}

button:active {
    transform: scale(.96);
}

button:hover {
    background: rgba(0,234,255,.2);
}

#sendBtn {
    background: var(--cyan);
    color: #00101a;
    font-weight: bold;
    border-color: var(--cyan);
}

#sendBtn:disabled {
    opacity: .5;
    cursor: wait;
}

.extra-controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    padding: 0 12px 14px;
}

.extra-controls button {
    padding: 10px 14px;
    min-height: 40px;
    font-size: 12px;
}

.note {
    color: var(--muted);
    font-size: 11px;
    text-align: center;
    line-height: 1.6;
}

footer {
    width: 100%;
    padding: 20px 12px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    border-top: 1px solid rgba(0,234,255,.15);
    background: rgba(5,10,22,.65);
}

footer span {
    color: var(--cyan);
}

@media (max-width: 420px) {
    .reactor {
        width: 125px;
        height: 125px;
    }

    #chat {
        height: 250px;
        padding: 12px;
    }

    .chat-controls {
        gap: 6px;
        padding: 9px;
    }

    #userInput {
        padding: 11px 9px;
    }

    button {
        padding: 0 10px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">J.A.R.V.I.S</div>
    <div class="subtitle">PERSONAL AI ASSISTANT</div>
</header>

<main>

    <div class="reactor" aria-label="Animated AI reactor">
        <div class="ring ring-one"></div>
        <div class="ring ring-two"></div>
        <div class="ring ring-three"></div>
        <div class="core"></div>
    </div>

    <div class="status">
        <span class="live-dot"></span>
        SYSTEM READY
    </div>

    <h1 class="welcome"><span>Hello</span></h1>

    <p class="description">
        Your personal AI assistant is ready.
        Ask a question, explore an idea, or use your voice.
    </p>

    <section class="chat-panel">
        <div class="chat-heading">
            <span>AI CONVERSATION</span>
            <span><span class="live-dot"></span>READY</span>
        </div>

        <div id="chat" aria-live="polite">
            <div class="message bot">Hello! How can I help you today?</div>
        </div>

        <form class="chat-controls" id="chatForm">
            <input
                id="userInput"
                type="text"
                placeholder="Ask JARVIS anything..."
                autocomplete="off"
                aria-label="Your message"
                required
            >
            <button type="submit" id="sendBtn">Send</button>
        </form>

        <div class="extra-controls">
            <button type="button" id="voiceBtn">🎙 Voice Input</button>
            <button type="button" id="speakBtn">🔊 Voice: ON</button>
            <button type="button" id="clearBtn">Clear Chat</button>
        </div>
    </section>

    <p class="note">
        Voice input depends on browser support and microphone permission.
    </p>

</main>

<footer>
    Created by <span>Samarth Gowda</span>
</footer>

<script>
"use strict";

// Your Cloudflare Worker endpoint
const WORKER_URL = "https://jarvis-ai.samarthg433.workers.dev/";

const chat = document.getElementById("chat");
const chatForm = document.getElementById("chatForm");
const userInput = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const voiceBtn = document.getElementById("voiceBtn");
const speakBtn = document.getElementById("speakBtn");
const clearBtn = document.getElementById("clearBtn");

let voiceEnabled = true;
let isWaiting = false;

function addMessage(text, type) {
    const message = document.createElement("div");
    message.className = "message " + type;
    message.textContent = text;
    chat.appendChild(message);
    chat.scrollTop = chat.scrollHeight;
    return message;
}

function speakText(text) {
    if (!voiceEnabled || !("speechSynthesis" in window)) return;

    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "en-IN";
    utterance.rate = 1;
    utterance.pitch = 1;

    window.speechSynthesis.speak(utterance);
}

async function sendMessage(text) {
    if (isWaiting) return;

    text = text.trim();
    if (!text) return;

    addMessage(text, "user");
    userInput.value = "";
    isWaiting = true;
    sendBtn.disabled = true;
    sendBtn.textContent = "...";

    const loading = addMessage("JARVIS is thinking...", "bot");

    try {
        const response = await fetch(WORKER_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: text
            })
        });

        let data;

        try {
            data = await response.json();
        } catch {
            throw new Error("The AI server returned an invalid response.");
        }

        if (!response.ok) {
            throw new Error(
                data.error || "Server error (" + response.status + ")."
            );
        }

        const reply = data.reply || "Sorry, I couldn't generate a response.";
        loading.textContent = reply;
        speakText(reply);

    } catch (error) {
        loading.textContent =
            "Connection problem. Please check your internet connection and Worker settings, then try again.";

        console.error("JARVIS error:", error);

    } finally {
        isWaiting = false;
        sendBtn.disabled = false;
        sendBtn.textContent = "Send";
        userInput.focus();
        chat.scrollTop = chat.scrollHeight;
    }
}

chatForm.addEventListener("submit", function(event) {
    event.preventDefault();
    sendMessage(userInput.value);
});

clearBtn.addEventListener("click", function() {
    chat.replaceChildren();
    addMessage("Hello! How can I help you today?", "bot");

    if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
    }
});

speakBtn.addEventListener("click", function() {
    voiceEnabled = !voiceEnabled;

    speakBtn.textContent = voiceEnabled
        ? "🔊 Voice: ON"
        : "🔇 Voice: OFF";

    if (!voiceEnabled && "speechSynthesis" in window) {
        window.speechSynthesis.cancel();
    }
});

// Voice recognition
const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition) {
    const recognition = new SpeechRecognition();
    recognition.lang = "en-IN";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    voiceBtn.addEventListener("click", function() {
        try {
            recognition.start();
            voiceBtn.textContent = "🎙 Listening...";
        } catch (error) {
            addMessage(
                "Voice recognition is already running. Please try again in a moment.",
                "bot"
            );
        }
    });

    recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        userInput.value = transcript;
        sendMessage(transcript);
    };

    recognition.onerror = function() {
        addMessage(
            "Voice input could not start. Check microphone permission and try again.",
            "bot"
        );
    };

    recognition.onend = function() {
        voiceBtn.textContent = "🎙 Voice Input";
    };

} else {
    voiceBtn.addEventListener("click", function() {
        addMessage(
            "Voice input is not supported by this browser. Try Chrome and allow microphone access.",
            "bot"
        );
    });
}
</script>

</body>
</html>
